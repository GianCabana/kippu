<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="same-origin"><title>Abriendo Webpay · Kippu</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#243d34;font-family:Arial,sans-serif;line-height:1.6}main{max-width:680px;margin:40px auto;padding:0 20px}.tarjeta{padding:32px;background:#fffefa;border:1px solid #e3e5dc;border-radius:20px}.marca{font:32px Georgia,serif;margin:0 0 18px}.etiqueta{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#657168}h1{font:34px/1.15 Georgia,serif;margin:16px 0}p{font-size:14px}.muted{color:#657168;font-size:12px}.estado{padding:14px 16px;background:#eaf0e2;border-radius:10px}.advertencia{background:#fff1d8}.dato{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #e3e5dc;font-size:12px}.dato span:last-child{overflow-wrap:anywhere;text-align:right;min-width:0}.total{font-size:24px;font-weight:bold;margin:24px 0}button,.boton{display:block;width:100%;min-height:48px;background:#173e34;color:white;border:0;border-radius:10px;padding:13px 18px;text-align:center;text-decoration:none;font:600 14px Arial,sans-serif;cursor:pointer;margin-top:12px}button:disabled{opacity:.55}a{color:#173e34}.acciones>a:not(.boton){display:block;padding:14px;text-align:center;font-size:12px}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #e3e5dc;font-size:13px}li span:first-child{overflow-wrap:anywhere;min-width:0}li span:last-child{white-space:nowrap}.aviso-demo{padding:12px;border:1px dashed #b4bda9;font-size:11px;text-align:center;margin-top:24px}button:focus-visible,a:focus-visible{outline:3px solid #a67e36;outline-offset:3px}@media(max-width:480px){main{margin:20px auto;padding:0 14px}.tarjeta{padding:23px}h1{font-size:29px}}@media print{@page{margin:12mm}body{background:white;color:black}main{max-width:100%;margin:0;padding:0}.tarjeta{padding:0;border:0;border-radius:0}.acciones,.no-imprimir{display:none!important}.aviso-demo{display:block}.dato,li{break-inside:avoid}h1{font-size:26px}}
</style></head><body><main><section class="tarjeta"><p class="marca">kippu</p><h1>Abriendo Webpay…</h1><p>Te estamos llevando al formulario de pago.</p>
<form id="transbank" method="post" action="{{ intento.url_webpay }}"><input type="hidden" name="token_ws" value="{{ intento.token }}"><noscript><button type="submit">Abrir formulario de Webpay</button></noscript></form>
<p>Si cancelaste, cerraste el formulario o Webpay muestra un error, vuelve al resultado para reintentar.</p><a class="boton" href="{{ resultado_url }}">Volver al resultado del pago</a>
</section></main><script>document.getElementById('transbank').submit();window.addEventListener('pageshow',e=>{if(e.persisted)window.location.replace('{{ resultado_url|escapejs }}')});</script></body></html>
