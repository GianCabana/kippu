{% load i18n idioma %}<figure class="foto-producto{% if not producto.imagen %} foto-producto--respaldo{% endif %}">
    {% if producto.imagen %}<img src="{{ producto.imagen.url }}" alt="{{ producto|traducido:"nombre" }}" loading="lazy" decoding="async" onerror="this.closest('.foto-producto').classList.add('foto-producto--respaldo')">{% endif %}
    <figcaption class="foto-producto__respaldo"><strong>{{ producto|traducido:"nombre" }}</strong><span>{% translate "Imagen no disponible" %}</span></figcaption>
</figure>
